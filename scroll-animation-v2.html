.ax-si { display: inline-block; }
.ax-word { display: inline-block; white-space: nowrap; }

            } catch (e) {}

            return false;
        }

        function becomeReady() {
            if (ready) return;
            ready = true;

            var list = deferred.filter(function (g) { return !g.shown; });
            deferred = [];

            list.forEach(function (g) {
                if (!g.repeat && g.trigger) observerIn.unobserve(g.trigger);
            });

            if (list.length) revealBatch(list);
            sweep();
        }

        function tryReady() {
            if (ready) return;

            var waited = performance.now() - t0;
            var loaded = document.readyState === "complete" && fontsOk;
            var blocked = preloaderVisible() && waited < PRELOADER_MAX;

            if ((loaded || waited > WAIT_MAX) && !blocked) {
                setTimeout(becomeReady, LOAD_DELAY);
            } else {
                setTimeout(tryReady, 100);
            }
        }


        /* ---------- reveal / conceal ---------- */

        /* Once an animation finishes, remove all of the snippet's rules ("settle"), so a section / card /
           header keeps its own hover, transform, transition and opacity exactly as before.
           This also applies in repeat mode: the rules are put back when it leaves (scroll up). */
        function lock(el) {
            var cs = getComputedStyle(el);
            var ms = maxTime(cs.transitionDuration, cs.transitionDelay);

            clearTimeout(el.__axT);

            el.__axT = setTimeout(function () {
                el.classList.add("ax-done");
                el.__axSettled = true;
            }, ms + 80);
        }

        /* Children of one sequence / stagger / cascade that come into view together keep their gap
           (the first starts at once, the second after the gap ...). A child that arrives later while
           scrolling simply plays in its own place - in a tall container every part plays at its own time. */
        function revealBatch(list) {
            var perSeq = new Map();

            list.forEach(function (g) {
                if (!g.seq) return;
                var arr = perSeq.get(g.seq) || [];
                arr.push(g);
                perSeq.set(g.seq, arr);
            });

            var now = performance.now();

            perSeq.forEach(function (arr, seq) {
                var tmin = Math.min.apply(null, arr.map(function (g) { return g.t; }));

                /* Children arriving within a short window (600 ms) follow one shared schedule, so the gap
                   (stagger) holds even when the content scrolls in frame by frame */
                if (!seq.wStart || now - seq.wStart > STAGGER_WINDOW) {
                    seq.wStart = now;
                    seq.wAnchor = tmin;
                    seq.wBase = seq.running > 0 ? 0 : seq.base;
                }

                arr.forEach(function (g) {
                    var due = seq.wBase + (g.t - seq.wAnchor);          /* time since the window started */
                    var delay = Math.max(0, due - (now - seq.wStart));

                    setVar(g.items[0], "--ax-delay", Math.round(delay + g.own) + "ms");
                });
            });

            list.forEach(function (g) { reveal(g, false); });
        }

        function reveal(group, instant) {
            group.shown = true;
            group.hyst = false;
            if (group.seq && !instant) group.seq.running++;

            group.items.forEach(function (el) {
                if (instant) {
                    el.classList.add("ax-done");
                    return;
                }

                el.classList.add("ax-in");

                if (!group.split && !hasAnyOf(el, SPLIT)) lock(el);
            });
        }

        function conceal(group) {
            group.shown = false;
            if (group.seq && group.seq.running > 0) group.seq.running--;

            group.items.forEach(function (el) {
                clearTimeout(el.__axT);
                el.classList.remove("ax-in");

                /* remove the settle and put the rules back: it now eases towards the hidden state */
                if (el.__axSettled) {
                    el.__axSettled = false;
                    el.classList.remove("ax-done");
                }
            });
        }


        /* ---------- observers ---------- */

        /* scroll direction: -1 = scrolling up (reverse), 1 = down */
        var scrollDir = 0, lastScrollY = window.pageYOffset;
        window.addEventListener("scroll", function () {
            var y = window.pageYOffset;
            if (y !== lastScrollY) scrollDir = y < lastScrollY ? -1 : 1;
            lastScrollY = y;
        }, { passive: true });

        var observerIn = new IntersectionObserver(function (entries) {

            var toReveal = [];

            entries.forEach(function (entry) {

                var group = groups.get(entry.target);
                if (!group) return;

                if (entry.isIntersecting) {

                    if (!group.shown && toReveal.indexOf(group) === -1) {

                        /* the page is still loading: remember it, and play as soon as loading finishes */
                        if (!ready) {
                            if (deferred.indexOf(group) === -1) deferred.push(group);
                            return;
                        }

                        toReveal.push(group);
                        if (!group.repeat) observerIn.unobserve(entry.target);
                    }
                    return;
                }

                if (!entry.rootBounds) return;

                if (
                    group.repeat && group.shown && scrollDir < 0 &&
                    entry.boundingClientRect.top >= entry.rootBounds.bottom
                ) {
                    group.hyst = true;          /* after a reverse, play forward again only from the normal line */
                    /* Scrolling UP: the element crossed the line it came in from,
                       and now plays in reverse, smoothly, while still on screen */
                    conceal(group);
                }

                /* (An element that is already above the viewport when the page opens must not stay hidden - that is
                   handled by sweep() from the real layout position. Judging a hidden element by its shifted position
                   was wrong: a fade-down column at the top looked "already scrolled past" and was shown instantly
                   with no animation.) */
            });

            if (toReveal.length) revealBatch(toReveal);

        }, { rootMargin: TRIGGER_MARGIN, threshold: 0 });

        /* Scrolling DOWN: an element that left through the TOP stays shown, so scrolling back up plays it in
           REVERSE as it leaves at the bottom (it never replays forward first). This observer is only a fallback
           for elements that leave through the bottom edge without crossing the trigger line (jumps, line = 1). */
        var observerOut = new IntersectionObserver(function (entries) {

            entries.forEach(function (entry) {
                var group = groups.get(entry.target);

                if (!group || !group.shown || entry.isIntersecting) return;

                /* Only hide it when the element has fully left the screen through the bottom.
                   (Being clipped by overflow:hidden or a slider does not count as "not visible".) */
                var r = entry.boundingClientRect;
                if (r.top >= window.innerHeight) conceal(group);
            });

        }, { rootMargin: "0px", threshold: 0 });


        /* meta (optional): { seq, t, own } - when the item belongs to a sequence / stagger / cascade */
        function register(trigger, items, repeat, split, meta) {
            if (!items.length) return;

            var group = { items: items, repeat: repeat, shown: false, split: split, seq: null, t: 0, own: 0, line: TRIGGER_LINE, trigger: trigger };

            if (meta) {
                group.seq = meta.seq || null;
                group.t = meta.t || 0;
                group.own = meta.own || 0;
                if (meta.line) group.line = meta.line;
            }

            groups.set(trigger, group);

            observerIn.observe(trigger);
            if (repeat) observerOut.observe(trigger);
        }


        /* ---------- stagger ---------- */

        /* ax-stagger  : every child gets the same effect, with an even gap.
           ax-sequence : every child has its own settings - written on the PARENT's classes:
                         ax-sequence ax-n1-tilt-right ax-n1-delay-300 ax-n2-zoom-in ax-n3-fade-up ...
                         ax-after-N (ax-n2-after-500) = "how long after the previous child".
           Both use the same engine. A class written directly on a child works too
           (it is used instead of the parent's class). */
        function setupStagger(parent) {

            var step = readNumber([parent], "step");
            if (step === null) step = readNamed([parent], STEP_NAMES, "ax-");
            if (step === null) step = STEP_DEFAULT;

            var parentTypes = FADE.filter(function (c) { return has(parent, c); });
            if (!parentTypes.length) parentTypes = ["ax-fade-up"];

            var ownTypes = FADE.concat(REVEAL, SPLIT);

            /* Default: each child plays in its own place as you scroll - in a tall container every part
               plays smoothly at its own time. ax-together: all children play together with the parent. */
            var together = has(parent, "ax-together");
            var baseDelay = readNumber([parent], "delay") || 0;
            var seqObj = { base: baseDelay, running: 0 };
            var time = together ? baseDelay : 0;
            var items = [];
            var allKids = itemsOf(parent);

            /* Put the children into their hidden state WITHOUT an animation: otherwise children that were
               already visible would fade out first (a reversed animation) and only then play forwards */
            holdTransitions(allKids);

            /* Children that are not visible right now (for example a hidden mobile menu) are left out of the gap
               and pattern counting, so the timing of the visible ones stays right */
            var kids = allKids.filter(isShown);
            var shownCount = 0;

            /* per-child settings from the parent's classes (ax-n1-..., ax-odd-..., ax-last-...) */
            applyChildSpecs(parent, kids);

            allKids.forEach(function (kid) {

                seen.add(kid);

                if (isMobile && has(parent, "ax-no-mobile")) {
                    kid.classList.add("ax-done");
                    return;
                }

                if (!hasAnyOf(kid, ownTypes)) {
                    parentTypes.forEach(function (c) { kid.classList.add(c); });
                }

                /* gap from the previous child: ax-after-N (on this child) or the parent's step */
                var gap = readNumber([kid], "after");
                if (gap === null) gap = step;

                if (kids.indexOf(kid) > -1) {
                    if (shownCount > 0) time += gap;
                    shownCount++;
                }

                var splitType = splitTypeOf(kid);

                if (splitType) {
                    var kidStep = readNumber([kid], "step");

                    splitText(kid, SPLIT_MODES[splitType]);
                    setVar(kid, "--ax-split-step", (kidStep !== null ? kidStep : SPLIT_STEPS[splitType]) + "ms");
                }

                if (together) {
                    applyVars(kid, [kid, parent], time);
                    items.push(kid);
                    return;
                }

                /* each child has its own trigger: the delay is decided when it is revealed (revealBatch) */
                applyVars(kid, [kid, parent], 0);

                if (kids.indexOf(kid) === -1) {
                    kid.classList.add("ax-done");   /* hidden child: leave it normal */
                    return;
                }

                register(kid, [kid], wantsRepeat(parent), false, {
                    seq: seqObj,
                    t: time,
                    own: readNumber([kid], "delay") || 0,
                    line: LINE_VISIBLE
                });
            });

            if (together) register(parent, items, wantsRepeat(parent), false, { line: LINE_VISIBLE });

            releaseTransitions(allKids);
            parent.classList.add("ax-ready");      /* the container can be shown now: its children are hidden and ready */
        }

        /* Switch transitions off before adding the new "hidden" classes and back on afterwards (after a reflow):
           this stops children that were already visible from visibly fading out (no reversed animation) */
        function holdTransitions(list) {
            list.forEach(function (el) {
                if (el.__axHold) return;
                el.__axHold = { value: el.style.transition, priority: el.style.getPropertyPriority("transition") };
                el.style.setProperty("transition", "none", "important");
            });
        }

        function releaseTransitions(list) {
            if (list.length) void list[0].offsetWidth;      /* apply the styles now, without a transition */

            list.forEach(function (el) {
                var h = el.__axHold;
                if (!h) return;
                el.__axHold = null;

                if (h.value) el.style.setProperty("transition", h.value, h.priority);
                else el.style.removeProperty("transition");
            });
        }

        /* ---------- cascade: an effect on a card / section, plus all the content inside it ----------
           Put ax-cascade on a container next to its effect class (for example ax-fade-left).
           The container plays its effect first, then the content inside (heading, text, image,
           button, list ...) plays the same effect - in a tall container every part plays as it scrolls in. */
        var CASCADE_STEP = 80;
        var CASCADE_MAX = 80;

        /* Sliders / carousels / tabs and similar are not entered: they count as one piece
           (the slides inside are clipped by overflow, so animating them one by one makes no sense) */
        var CASCADE_OPAQUE = ".swiper,.swiper-container,.swiper-wrapper,.slick-slider,.owl-carousel,.splide,.flickity-enabled," +
            ".glide,.elementor-widget-image-carousel,.elementor-widget-media-carousel,.elementor-widget-testimonial-carousel," +
            ".elementor-widget-loop-carousel,.e-n-carousel,[class*='carousel'],[class*='slider'],[class*='gallery-slider']," +
            "video,iframe,canvas,svg,table,select,form";

        function isOpaque(el) {
            try { return el.matches(CASCADE_OPAQUE); } catch (e) { return false; }
        }

        function cascadeUnits(node, depth, out) {

            autoKids(node, false).forEach(function (kid) {

                if (out.length >= CASCADE_MAX) return;

                /* an element with its own animation class plays by itself */
                if (hasAnyOf(kid, FADE.concat(REVEAL, SPLIT)) || has(kid, "ax-stagger") || has(kid, "ax-sequence") || has(kid, "ax-cascade")) return;

                if (isOpaque(kid)) {
                    out.push(kid);                               /* slider / carousel: one piece */
                    return;
                }

                if (depth < 4 && !hasOwnText(kid)) {
                    var sub = autoKids(kid, false);

                    if (sub.length >= 2) {
                        cascadeUnits(kid, depth + 1, out);      /* an inner container: use its children */
                        return;
                    }
                }

                out.push(kid);                                   /* one piece of content */
            });

            return out;
        }

        var cascadeStates = new Map();

        function setupCascade(container) {

            if (isMobile && has(container, "ax-no-mobile")) {
                container.classList.add("ax-ready");
                return;
            }

            var st = cascadeStates.get(container);

            if (!st) {
                var types = FADE.filter(function (c) { return has(container, c); });
                if (!types.length) types = ["ax-fade-up"];

                var step = readNumber([container], "step");
                if (step === null) step = CASCADE_STEP;

                var duration = readNumber([container], "duration");
                if (duration === null) duration = readNamed([container], DURATION_NAMES, "ax-");
                if (duration === null) duration = DURATION_DEFAULT;

                var delay = readNumber([container], "delay") || 0;

                st = {
                    types: types,
                    step: step,
                    repeat: wantsRepeat(container),
                    next: 0,                                   /* number of the next child */
                    idle: 0,
                    /* starts after the container: about 35% of its duration */
                    seq: { base: delay + Math.round(duration * 0.35), running: 0 }
                };

                cascadeStates.set(container, st);
                watchCascade(container, st);
            }

            /* New pieces (not seen yet): content created later by JavaScript (sliders, tabs, AJAX)
               is picked up as well */
            var fresh = cascadeUnits(container, 0, []).filter(function (u) {
                return !seen.has(u) && isShown(u);
            });

            st.units = st.units || [];

            holdTransitions(fresh);

            fresh.forEach(function (unit) {

                seen.add(unit);

                /* if an empty / old wrapper was a piece and new content has now appeared inside it,
                   drop the wrapper's own animation (otherwise it would animate twice) */
                st.units = st.units.filter(function (old) {
                    if (old !== unit && old.contains(unit)) {
                        groups.delete(old);
                        observerIn.unobserve(old);
                        observerOut.unobserve(old);
                        old.classList.add("ax-done");
                        return false;
                    }
                    return true;
                });

                st.types.forEach(function (c) { unit.classList.add(c); });
                applyVars(unit, [unit, container], 0);

                register(unit, [unit], st.repeat, false, { seq: st.seq, t: st.next * st.step, own: 0, line: LINE_VISIBLE });
                st.units.push(unit);
                st.next++;
            });

            releaseTransitions(fresh);
            container.classList.add("ax-ready");

            return fresh.length;
        }

        /* if the content inside the container changes later (built by JS / AJAX), look again */
        function watchCascade(container, st) {
            if (!("MutationObserver" in window)) return;

            var timer = 0;

            var mo = new MutationObserver(function () {
                clearTimeout(timer);

                timer = setTimeout(function () {
                    var added = setupCascade(container);
                    st.idle = added ? 0 : st.idle + 1;

                    if (added) queueSweep();
                    if (st.idle >= 12) mo.disconnect();         /* nothing new is arriving: stop watching */
                }, 250);
            });

            mo.observe(container, { childList: true, subtree: true });
        }


        /* ---------- scan ---------- */

        function scan() {

            var nodes = document.querySelectorAll(SELECTOR);

            for (var i = 0; i < nodes.length; i++) {

                var el = nodes[i];

                if (seen.has(el)) continue;
                seen.add(el);

                if (has(el, "ax-stagger") || has(el, "ax-sequence")) {
                    setupStagger(el);
                    continue;
                }

                if (isMobile && has(el, "ax-no-mobile")) {
                    el.classList.add("ax-done");
                    continue;
                }

                /* a card / section's own effect, plus the content inside it (ax-cascade) */
                if (has(el, "ax-cascade")) {
                    setupCascade(el);
                    if (!hasAnyOf(el, FADE.concat(REVEAL, SPLIT))) continue;
                }

                var splitType = splitTypeOf(el);

                if (splitType) {
                    var splitStep = readNumber([el], "step");

                    splitText(el, SPLIT_MODES[splitType]);
                    setVar(el, "--ax-split-step", (splitStep !== null ? splitStep : SPLIT_STEPS[splitType]) + "ms");
                }

                applyVars(el, [el], 0);
                /* with ax-cascade on the whole section, the section itself plays as soon as it is visible (before its content) */
                register(el, [el], wantsRepeat(el), !!splitType, has(el, "ax-cascade") ? { line: LINE_VISIBLE } : null);
            }
        }

        /* ---------- end of the page / short pages ----------
           The trigger line sits 12% above the bottom of the screen. An element at the very end of the page
           (a short footer), or on a page that cannot scroll, would never reach that line.
           When the page is at its end, play whatever element is visible on screen. */
        function atBottom() {
            /* hidden elements (translate) make the page's scroll height a little taller (~50-150px),
               so a little tolerance is allowed */
            return window.innerHeight + window.pageYOffset >= document.documentElement.scrollHeight - 160;
        }

        /* On every scroll, this checks each element's REAL (layout) position - unaffected by transforms (the
           hidden shift) and by overflow:hidden / slider clipping. IntersectionObserver treats clipped
           elements as "not visible", so it cannot be trusted on its own. */
        function sweep() {
            if (!ready) return;

            var y = window.pageYOffset, vh = window.innerHeight;
            var bottomReached = atBottom();
            var list = [];
            var gone = [];

            groups.forEach(function (group, trigger) {
                if (!trigger.isConnected) { gone.push(trigger); return; }
                if (group.shown) {
                    if (group.repeat && scrollDir < 0 && trigger.offsetParent !== null && !group.fixedCtx) {
                        var rt = 0, rn = trigger;
                        while (rn) { rt += rn.offsetTop; rn = rn.offsetParent; }

                        if (rt - y > vh * REVERSE_LINE) {
                            group.hyst = true;
                            conceal(group);
                        }
                    }
                    return;
                }

                if (group.hyst && scrollDir < 0) return;           /* reversed while scrolling up: do not replay until the user scrolls down again */

                var fixed = false;

                if (trigger.offsetParent === null) {
                    fixed = getComputedStyle(trigger).position === "fixed";
                    if (!fixed) return;                                /* hidden element */
                }

                /* Children inside a fixed header: they are always on screen (they do not move with scroll), so play
                   them as soon as the page has loaded - do not treat them as "already scrolled past" */
                if (group.fixedCtx === undefined) {
                    group.fixedCtx = fixed;

                    for (var n = trigger; !group.fixedCtx && n && n !== document.body; n = n.parentElement) {
                        if (getComputedStyle(n).position === "fixed") group.fixedCtx = true;
                    }
                }

                if (group.fixedCtx) {
                    list.push(group);
                    if (!group.repeat) observerIn.unobserve(trigger);
                    return;
                }

                /* real (layout) position, without transforms */
                var top = 0, node = trigger;
                while (node) { top += node.offsetTop; node = node.offsetParent; }

                var bottom = top + trigger.offsetHeight;
                var line = bottomReached ? vh : vh * (group.hyst ? Math.min(group.line, TRIGGER_LINE) : group.line);   /* this group's trigger line */

                if (top - y < line && bottom - y > 0) {
                    list.push(group);
                    if (!group.repeat) observerIn.unobserve(trigger);

                } else if (!group.repeat && bottom - y <= 0) {
                    /* already above the viewport (the page opened part-way down): do not leave it hidden */
                    reveal(group, true);
                    observerIn.unobserve(trigger);
                }
            });

            gone.forEach(function (t) { groups.delete(t); observerIn.unobserve(t); observerOut.unobserve(t); });

            if (list.length) revealBatch(list);
        }

        var sweepFrame = 0;
        function queueSweep() {
            if (sweepFrame) return;
            sweepFrame = requestAnimationFrame(function () { sweepFrame = 0; sweep(); });
        }

        scan();
        queueSweep();

        if (WAIT_FOR_LOAD) tryReady();

        /* the page layout (images / fonts) settles later: look again after a while */
        [300, 1000, 2500].forEach(function (ms) { setTimeout(queueSweep, ms); });

        window.addEventListener("scroll", queueSweep, { passive: true });
        window.addEventListener("resize", queueSweep);
        window.addEventListener("load", function () {
            scan();

            /* cascade containers: also pick up content that was created after load */
            cascadeStates.forEach(function (st, container) {
                if (setupCascade(container)) queueSweep();
            });

            queueSweep();
        });

        window.axRefresh = function () {
            applyTargets();
            scan();
            queueSweep();
        };

        /* Debug: type  axInfo()  or  axInfo("#my-section")  in the console -
           it shows which elements were found, their children, and their classes / state */
        window.axInfo = function (selector) {
            var rows = [];

            groups.forEach(function (group, trigger) {
                if (selector) {
                    try { if (!(trigger.matches(selector) || trigger.closest(selector))) return; } catch (e) { return; }
                }

                rows.push({
                    element: trigger.tagName.toLowerCase() + (trigger.id ? "#" + trigger.id : "") +
                             (trigger.className ? "." + String(trigger.className).trim().split(/\s+/).slice(0, 2).join(".") : ""),
                    items: group.items.length,
                    inSequence: !!group.seq,
                    repeat: group.repeat,
                    shown: group.shown,
                    firstItem: group.items[0] ? String(group.items[0].className).replace(/\s+/g, " ").slice(0, 70) : ""
                });
            });

            if (console.table) console.table(rows); else console.log(rows);
            return rows.length + " animated group(s)";
        };
    }

    /* ==========================================
       RUN (if anything goes wrong, the page must never stay hidden)
    ========================================== */

    function run() {
        try {
            start();
        } catch (error) {
            root.classList.add("ax-off");
            if (window.console) console.error("[ax-scroll]", error);
        } finally {
            releaseTargetsStyle();
        }
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", run);
    } else {
        run();
    }

})();
</script>
